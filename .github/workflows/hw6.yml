name: Configure Wordpress Server with Ansible

on:
  workflow_dispatch:
    inputs: 
      wordpress_ip:
        description: 'Wordpress Server IP Address'
        required: true
      sql_ip:
        description: 'SQL Server IP Address'
        required: true  

env:
    WORDPRESS_IP: ${{ inputs.wordpress_ip }}
    SQL_IP: ${{ inputs.sql_ip }}
    AWS_REGION: ap-southeast-2

jobs:
  ansible:
    name: Configure Servers with Ansible
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible pymysql

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.BALLY }}" > ~/.ssh/ansibleSSH.pem
          chmod 600 ~/.ssh/ansibleSSH.pem

      - name: Generate Ansible Inventory
        run: |
          cat > HW6/ansible/inventories/hosts.ini << EOF
          [wordpress]
          wordpress1 ansible_ssh_host=${{ env.WORDPRESS_IP }}

          [sql]
          sql1 ansible_ssh_host=${{ env.SQL_IP }}

          EOF

      - name: Display Inventory
        run: cat HW6/ansible/inventories/hosts.ini

      - name: Run Ansible Playbook
        working-directory: HW6/ansible
        run: |
          ansible-playbook -i inventories/hosts.ini site.yml
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"

      - name: Display Server Information
        run: |
          echo "=== Deployment Complete ==="
          echo "Wordpress Server: http://${{ env.WORDPRESS_IP }}"
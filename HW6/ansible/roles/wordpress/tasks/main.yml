---
# Main tasks for webserver role
- name: Update system packages
  ansible.builtin.dnf:
    name: "*"
    state: latest

- name: Install required packages
  ansible.builtin.dnf:
    name:
      - httpd
      - php
      - php-mysqli
      - php-xml
      - php-mbstring
      - php-cli
      - mariadb105
    state: present

- name: Start and enable Apache
  ansible.builtin.systemd:
    name: httpd
    state: started
    enabled: yes

- name: Install unzip package
  ansible.builtin.dnf:
    name: unzip
    state: present

- name: Download WordPress
  ansible.builtin.get_url:
    url: https://wordpress.org/latest.zip
    dest: /var/www/html/latest.zip
    mode: '0644'

- name: Unzip WordPress
  ansible.builtin.unarchive:
    src: /var/www/html/latest.zip
    dest: /var/www/html/
    remote_src: yes
    creates: /var/www/html/wordpress/wp-config-sample.php

- name: Move WordPress files to web root
  ansible.builtin.shell:
    cmd: |
      shopt -s dotglob
      mv /var/www/html/wordpress/* /var/www/html/
      rmdir /var/www/html/wordpress
    creates: /var/www/html/wp-config-sample.php

- name: Remove WordPress zip file
  ansible.builtin.file:
    path: /var/www/html/latest.zip
    state: absent

- name: Create wp-config.php from sample
  ansible.builtin.copy:
    src: /var/www/html/wp-config-sample.php
    dest: /var/www/html/wp-config.php
    remote_src: yes
    owner: apache
    group: apache
    mode: '0644'
    force: no

- name: Configure database connection in wp-config.php
  ansible.builtin.lineinfile:
    path: /var/www/html/wp-config.php
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    backrefs: yes
  loop:
    - regexp: "define\\(\\s*'DB_NAME',\\s*'.*'\\s*\\);"
      line: "define( 'DB_NAME', '{{ db_name }}' );"
    - regexp: "define\\(\\s*'DB_USER',\\s*'.*'\\s*\\);"
      line: "define( 'DB_USER', '{{ db_user }}' );"
    - regexp: "define\\(\\s*'DB_PASSWORD',\\s*'.*'\\s*\\);"
      line: "define( 'DB_PASSWORD', '{{ db_password }}' );"
    - regexp: "define\\(\\s*'DB_HOST',\\s*'.*'\\s*\\);"
      line: "define( 'DB_HOST', '{{ db_host }}' );"
  notify: Restart Apache
